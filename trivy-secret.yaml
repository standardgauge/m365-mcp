# Trivy secret-scanning configuration.
#
# Run with: trivy fs --scanners secret --secret-config trivy-secret.yaml .
#
# One allow-rule, mirroring the equivalent entry in .gitleaks.toml. Scoped to
# the literal value rather than to a path, so any other secret introduced into
# docker-compose.yml is still flagged.
allow-rules:
  - id: azurite-well-known-emulator-key
    description: >-
      Public, documented Azurite storage-emulator account key shipped by
      Microsoft (the fixed devstoreaccount1 key). Used in docker-compose.yml
      for local development only. Not a credential to anything real, so
      flagging it adds noise that could mask a genuine leak.
    regex: 'Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=='
