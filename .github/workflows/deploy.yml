name: Deploy

# Builds the image, pushes it to your Azure Container Registry, rolls the
# Container App, and then proves the deploy rather than assuming it.
#
# This workflow is inert until you turn it on. Set these repository VARIABLES:
#   DEPLOY_ENABLED         'true' to allow this workflow to run at all
#   AUTO_UPDATE            'true' to deploy each new main commit once CI has
#                          passed on it. Unset means pinned: only a manual
#                          dispatch deploys.
#   AZURE_RESOURCE_GROUP   e.g. rg-m365-mcp
#   CONTAINER_APP_NAME     e.g. m365-mcp
#   ACR_NAME               e.g. m365mcpacr  (no hyphens)
#
# And these repository SECRETS:
#   AZURE_CREDENTIALS   service principal JSON with Contributor on the resource
#                       group and AcrPush on the registry. Used by azure/login
#                       and by az acr login, so no ACR admin user is needed.
#   AZURE_CLIENT_ID     your Entra app client ID. Baked into the admin SPA at
#                       build time; the backend reads its own from a Container
#                       App secret.
#   AZURE_TENANT_ID     your Microsoft 365 tenant ID. Same dual purpose.

# An automatic deploy starts when CI finishes on main, not when main moves. On
# a push trigger this workflow raced CI on the same commit, so a red main
# shipped to every tracking instance anyway. CI is the same workflow in every
# fork and runs on the same commit, so "CI passed here" means "CI passed on
# exactly what is about to be built".
#
# There is no path filter. workflow_run cannot take one, and it would be wrong
# here anyway: an instance that skips a docs-only commit never reports that sha
# on /health, and anything that waits on /health for a sha (a canary gate in
# front of other instances, say) then waits forever.
#
# A manual dispatch is not gated on CI. It is the break-glass and rollback path:
# redeploying a known-good image tag has to work while main is red.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (default: sha-<short>)'
        required: false
        type: string

permissions:
  contents: read

# Serialize deploys so a fast follow-up commit cannot race the previous run
# into az containerapp update. Never cancel in progress: a half-rolled
# revision is worse than waiting.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # The commit to build and prove. On workflow_run, github.sha is whatever main
  # points at when this run starts, which need not be the commit CI passed on.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
  ACR_NAME: ${{ vars.ACR_NAME }}

jobs:
  # Decides whether this run deploys. Every clause of the workflow_run condition
  # matters: conclusion is the CI gate itself; event and head_repository stop a
  # pull request from another fork, whose branch happens to be called main, from
  # starting a deploy (the branches: filter matches the head branch name only).
  gate:
    name: Gate on CI
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.AUTO_UPDATE == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      # CI runs finish in any order. If main has moved on since the commit CI
      # passed on, deploying it now would roll the instance back behind a newer
      # commit that is already live or about to be. The newer commit's own CI
      # run deploys it; if that run fails, the instance stays where it is.
      - name: Commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual dispatch: deploying ${DEPLOY_SHA} without the CI gate"
            echo "- **Gate:** manual dispatch, CI not consulted" >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$tip" != "$DEPLOY_SHA" ]; then
            echo "::notice::CI passed on ${DEPLOY_SHA} but main is now ${tip}; leaving that commit to its own CI run"
            echo "- **Gate:** skipped, main moved on to ${tip}" >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "- **Gate:** CI passed on ${DEPLOY_SHA}, the tip of main" >> "$GITHUB_STEP_SUMMARY"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  build-push-deploy:
    name: Build, push to ACR, deploy to Container App
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write  # docker/build-push-action GHA cache backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Check required configuration
        run: |
          missing=
          for v in AZURE_RESOURCE_GROUP CONTAINER_APP_NAME ACR_NAME; do
            eval "val=\${$v}"
            [ -n "$val" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            exit 1
          fi

      - name: Resolve image tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="sha-$(echo "${DEPLOY_SHA}" | cut -c1-7)"
          fi
          if ! echo "$TAG" | grep -qE '^[a-zA-Z0-9._-]+$'; then
            echo "::error::Invalid tag: '$TAG' — only [a-zA-Z0-9._-] allowed"
            exit 1
          fi
          IMAGE="${ACR_NAME}.azurecr.io/${CONTAINER_APP_NAME}:${TAG}"
          echo "tag=${TAG}"     >>"$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >>"$GITHUB_OUTPUT"
          echo "Will deploy: ${IMAGE}"

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:latest
          build-args: |
            AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}
            AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
            GIT_SHA=${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image listens on 8080 (it runs as a non-root user, which cannot bind
      # ports below 1024), but this workflow only swaps the image and never
      # applies Bicep. An app created before that change, or by hand, can still
      # have its ingress targeting 80, and then every new revision fails its
      # probe while the old one keeps serving. Converge the live ingress to the
      # port the image binds. A no-op once it matches. It runs before the image
      # update because a revision takes its default probes from the ingress
      # port when it is created.
      - name: Ensure ingress targets the container port
        env:
          CONTAINER_PORT: "8080"
        run: |
          set -euo pipefail
          current=$(az containerapp show \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query "properties.configuration.ingress.targetPort" -o tsv)
          if [ "$current" = "$CONTAINER_PORT" ]; then
            echo "ingress already targets ${CONTAINER_PORT}"
          else
            echo "ingress targets '${current}', moving to ${CONTAINER_PORT}"
            az containerapp ingress update \
              --name "${CONTAINER_APP_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --target-port "${CONTAINER_PORT}" >/dev/null
            echo "- **Ingress:** moved targetPort from ${current} to ${CONTAINER_PORT}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update Container App
        env:
          DEPLOY_IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          az containerapp update \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "$DEPLOY_IMAGE"

      # Prove the deploy works rather than that az returned 0. Both assertions
      # below have failed silently in production before: a 200 from the SPA
      # catch-all masking a dead /health route, and a post-login redirect
      # pointing at a path the Functions host reserves.
      - name: Post-deploy smoke
        env:
          EXPECTED_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          set -euo pipefail

          FQDN=$(az containerapp show \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          # 1. /health must serve JSON carrying the commit we just shipped.
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 15 "https://${FQDN}/health" || echo 000)
            ctype=$(curl -s -o /dev/null -w '%{content_type}' --max-time 15 "https://${FQDN}/health" || echo none)
            got=$(jq -r '.sha // empty' /tmp/health.json 2>/dev/null || true)
            if [ "$code" = "200" ] && [ "$got" = "$EXPECTED_SHA" ]; then
              case "$ctype" in
                application/json*) break ;;
                *) echo "::error::/health returned 200 but Content-Type is '${ctype}', not JSON — the SPA catch-all is masking a dead route"; exit 1 ;;
              esac
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::/health did not report ${EXPECTED_SHA} within 300s (last: code=${code} type=${ctype} sha=${got:-none})"
              exit 1
            fi
            sleep 10
          done
          echo "health OK — serving ${EXPECTED_SHA} as ${ctype}"

          # 2. The post-login redirect target must actually be the admin UI.
          FRONTEND_URL=$(az containerapp secret show \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --secret-name frontend-url --query value -o tsv 2>/dev/null || true)
          if [ -z "$FRONTEND_URL" ]; then
            echo "::notice::no frontend-url secret set; app falls back to the site root"
            FRONTEND_URL="https://${FQDN}/"
          fi

          # /admin and /runtime belong to the Functions host: it answers them
          # before any of our routes, so a redirect there can never land.
          FRONTEND_PATH=$(echo "$FRONTEND_URL" | sed -E 's#^https?://[^/]+##; s#/+$##' | tr 'A-Z' 'a-z')
          case "$FRONTEND_PATH" in
            /admin|/admin/*|/runtime|/runtime/*)
              echo "::error::frontend-url is '${FRONTEND_URL}', whose path is reserved by the Azure Functions host — post-login redirects there 404 (see docs/operations-runbook.md, Reserved paths)"
              exit 1 ;;
          esac

          fcode=$(curl -s -o /tmp/frontend.html -w '%{http_code}' --max-time 20 "$FRONTEND_URL" || echo 000)
          if [ "$fcode" != "200" ]; then
            echo "::error::frontend-url '${FRONTEND_URL}' returned HTTP ${fcode}, expected 200"
            exit 1
          fi
          if ! grep -q '<title>MCP Admin</title>' /tmp/frontend.html; then
            echo "::error::frontend-url '${FRONTEND_URL}' returned 200 but is not the admin SPA"
            exit 1
          fi
          echo "frontend OK — ${FRONTEND_URL} serves the admin SPA"
